```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />

  <title>404 — Page Not Found</title>
  <meta name="robots" content="noindex" />

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap");

    :root {
      --bg: #050505;
      --text: #f5f5f5;
      --muted: rgba(255,255,255,.46);
      --border: rgba(255,255,255,.12);
      --border-hover: rgba(255,255,255,.3);
      --glass: rgba(255,255,255,.035);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--text);
      font-family: "Space Grotesk", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.075), transparent 24%),
        radial-gradient(circle at 18% 18%, rgba(255,255,255,.035), transparent 1px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.03), transparent 1px),
        radial-gradient(circle at 30% 85%, rgba(255,255,255,.035), transparent 1px);
      background-size:
        auto,
        120px 120px,
        170px 170px,
        220px 220px;
      animation: drift 22s ease-in-out infinite alternate;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      position: relative;
      width: min(92vw, 620px);
      padding: clamp(38px, 7vw, 68px);
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.018)
        );

      box-shadow:
        0 40px 100px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.06);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      text-align: center;

      animation:
        enter 1.1s cubic-bezier(.16,1,.3,1) both,
        float 7s ease-in-out 1.1s infinite;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      left: 50%;
      top: 20%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      filter: blur(70px);
      pointer-events: none;
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: .65rem;
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .code {
      position: relative;
      z-index: 1;

      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 300;
      line-height: .82;
      letter-spacing: -.06em;

      margin-bottom: 30px;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          rgba(255,255,255,.65) 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow: 0 0 60px rgba(255,255,255,.06);
    }

    .title {
      position: relative;
      z-index: 1;
      margin-bottom: 12px;
      font-size: clamp(1.15rem, 3vw, 1.55rem);
      font-weight: 500;
      letter-spacing: -.02em;
    }

    .description {
      position: relative;
      z-index: 1;
      max-width: 430px;
      margin: 0 auto 34px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 300;
      line-height: 1.7;
    }

    .return {
      position: relative;
      z-index: 1;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      min-width: 165px;
      padding: 14px 20px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: rgba(255,255,255,.04);

      color: rgba(255,255,255,.88);
      text-decoration: none;
      text-transform: uppercase;

      font-size: .65rem;
      font-weight: 500;
      letter-spacing: .16em;

      transition:
        transform .35s cubic-bezier(.16,1,.3,1),
        background .35s ease,
        color .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
    }

    .return::after {
      content: "→";
      font-size: .9rem;
      transition: transform .35s cubic-bezier(.16,1,.3,1);
    }

    .return:hover,
    .return:focus-visible {
      transform: translateY(-3px);
      background: #fff;
      border-color: #fff;
      color: #000;
      box-shadow:
        0 14px 40px rgba(255,255,255,.12);
      outline: none;
    }

    .return:hover::after,
    .return:focus-visible::after {
      transform: translateX(4px);
    }

    .corner {
      position: fixed;
      bottom: 22px;
      color: rgba(255,255,255,.22);
      font-size: .52rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .corner.left {
      left: 24px;
    }

    .corner.right {
      right: 24px;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(24px) scale(.97);
        filter: blur(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes drift {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.05) translate3d(5px, -5px, 0);
      }
    }

    @media (max-width: 520px) {
      .card {
        padding: 42px 24px;
        border-radius: 22px;
      }

      .description {
        font-size: .82rem;
      }

      .corner {
        bottom: 15px;
        font-size: .44rem;
      }

      .corner.left {
        left: 16px;
      }

      .corner.right {
        right: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="card">
      <p class="eyebrow">Error</p>

      <h1 class="code">404</h1>

      <h2 class="title">Lost in the void.</h2>

      <p class="description">
        The page you were looking for doesn't exist, was moved,
        or slipped somewhere beyond the observable universe.
      </p>

      <a class="return" href="index.html">Return Home</a>
    </section>
  </main>

  <div class="corner left">Jakub K. Rucinski</div>
  <div class="corner right">∞</div>
</body>
</html>
