<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />

  <title>Jakub K. Rucinski — Novelist</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap");

    :root {
      --black: #000;
      --white: #fff;
      --muted: rgba(255, 255, 255, 0.48);
      --line: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--black);
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--white);
      font-family: "Space Grotesk", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 44%, rgba(255,255,255,.055), transparent 22%),
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.025), transparent 1px),
        radial-gradient(circle at 78% 76%, rgba(255,255,255,.035), transparent 1px),
        radial-gradient(circle at 31% 82%, rgba(255,255,255,.025), transparent 1px),
        radial-gradient(circle at 83% 24%, rgba(255,255,255,.025), transparent 1px);
      background-size:
        auto,
        137px 137px,
        173px 173px,
        211px 211px,
        263px 263px;
      animation: cosmos 24s linear infinite alternate;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .core {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform: translateY(-1.5vh);
    }

    .name {
      margin-bottom: 42px;
      font-size: clamp(.9rem, 1.25vw, 1.08rem);
      font-weight: 400;
      letter-spacing: .42em;
      padding-left: .42em;
      white-space: nowrap;
      animation: appear 1.5s cubic-bezier(.16,1,.3,1) both;
    }

    .sigil-wrap {
      position: relative;
      width: clamp(122px, 17vw, 180px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-bottom: 48px;
      animation: appear 1.8s .12s cubic-bezier(.16,1,.3,1) both;
    }

    .sigil-wrap::before {
      content: "";
      position: absolute;
      width: 72%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255,255,255,.09);
      filter: blur(35px);
      animation: aura 5s ease-in-out infinite;
    }

    .sigil-wrap::after {
      content: "";
      position: absolute;
      inset: -15%;
      border: 1px solid rgba(255,255,255,.035);
      border-radius: 50%;
      animation: orbit 18s linear infinite;
      border-top-color: rgba(255,255,255,.17);
    }

    .sigil {
      position: relative;
      width: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 8px rgba(255,255,255,.18));
      animation: breathe 6s ease-in-out infinite;
    }

    .sigil path,
    .sigil polygon,
    .sigil circle {
      fill: none;
      stroke: #fff;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sigil .main {
      stroke-width: 2.25;
    }

    .sigil .fine {
      stroke-width: .7;
      opacity: .34;
    }

    .sigil .point {
      fill: #fff;
      stroke: none;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      animation: appear 1.8s .25s cubic-bezier(.16,1,.3,1) both;
    }

    nav a {
      position: relative;
      min-width: 92px;
      padding: 12px 17px;
      border: 1px solid var(--line);
      color: rgba(255,255,255,.72);
      text-decoration: none;
      text-transform: uppercase;
      font-size: .64rem;
      font-weight: 400;
      letter-spacing: .18em;
      overflow: hidden;
      transition:
        color .35s ease,
        border-color .35s ease,
        transform .35s cubic-bezier(.16,1,.3,1),
        box-shadow .35s ease;
    }

    nav a::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #fff;
      transform: translateY(102%);
      transition: transform .4s cubic-bezier(.16,1,.3,1);
      z-index: -1;
    }

    nav a:hover,
    nav a:focus-visible {
      color: #000;
      border-color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(255,255,255,.08);
      outline: none;
    }

    nav a:hover::before,
    nav a:focus-visible::before {
      transform: translateY(0);
    }

    .coordinates {
      position: fixed;
      bottom: 22px;
      left: 24px;
      color: rgba(255,255,255,.2);
      font-size: .52rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      animation: appear 2s .5s both;
    }

    .mark {
      position: fixed;
      bottom: 22px;
      right: 24px;
      color: rgba(255,255,255,.2);
      font-size: .52rem;
      letter-spacing: .22em;
      animation: appear 2s .5s both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
        filter: blur(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 7px rgba(255,255,255,.16));
      }

      50% {
        transform: scale(1.025);
        filter: drop-shadow(0 0 14px rgba(255,255,255,.28));
      }
    }

    @keyframes aura {
      0%, 100% {
        opacity: .35;
        transform: scale(.9);
      }

      50% {
        opacity: .65;
        transform: scale(1.12);
      }
    }

    @keyframes orbit {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes cosmos {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.04) translate3d(3px, -4px, 0);
      }
    }

    @media (max-width: 520px) {
      .name {
        margin-bottom: 34px;
        font-size: .74rem;
        letter-spacing: .3em;
        padding-left: .3em;
      }

      .sigil-wrap {
        width: 132px;
        margin-bottom: 38px;
      }

      nav {
        width: min(100%, 330px);
        gap: 7px;
      }

      nav a {
        flex: 1;
        min-width: 0;
        padding: 11px 8px;
        font-size: .57rem;
        letter-spacing: .14em;
      }

      .coordinates,
      .mark {
        bottom: 16px;
        font-size: .45rem;
      }

      .coordinates {
        left: 16px;
      }

      .mark {
        right: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="core">
      <h1 class="name">JAKUB K. RUCINSKI</h1>

      <div class="sigil-wrap" aria-hidden="true">
        <svg class="sigil" viewBox="0 0 200 200">
          <circle class="fine" cx="100" cy="100" r="73" />

          <path
            class="main"
            d="
              M100 14
              L121 77
              L184 77
              L133 115
              L153 177
              L100 139
              L47 177
              L67 115
              L16 77
              L79 77
              Z
            "
          />

          <path
            class="fine"
            d="
              M100 14
              L100 186
              M16 77
              L153 177
              M184 77
              L47 177
            "
          />

          <circle class="point" cx="100" cy="100" r="2.6" />
        </svg>
      </div>

      <nav aria-label="Primary navigation">
        <a href="books.html">Books</a>
        <a href="links.html">Links</a>
        <a href="mailto:jakubscool@gmail.com">Contact</a>
      </nav>
    </section>
  </main>

  <div class="coordinates">Copyright 2026</div>
  <div class="mark">∞</div>
</body>
</html>
