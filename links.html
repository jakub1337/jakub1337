<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />

  <title>Links — Jakub K. Rucinski</title>
  <meta name="description" content="Jakub Rucinski is a thriller and speculative fiction novelist from Miami, Florida." />

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap");

    :root {
      --black: #000;
      --white: #fff;
      --ease: cubic-bezier(.16,1,.3,1);

      --instagram: #ff4fd8;
      --letterboxd: #00e054;
      --twitter: #6baeff;
      --tiktok: #ff406c;
      --youtube: #ff3030;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: #000;
      color-scheme: dark;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100svh;
      background: #000;
      color: #fff;
      font-family: "Space Grotesk", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 46%, rgba(255,255,255,.055), transparent 22%),
        radial-gradient(circle at 13% 18%, rgba(255,255,255,.12) 0 1px, transparent 1.4px),
        radial-gradient(circle at 81% 27%, rgba(255,255,255,.09) 0 1px, transparent 1.4px),
        radial-gradient(circle at 27% 79%, rgba(255,255,255,.08) 0 1px, transparent 1.3px),
        radial-gradient(circle at 87% 83%, rgba(255,255,255,.07) 0 1px, transparent 1.3px);
      background-size:
        auto,
        181px 181px,
        239px 239px,
        313px 313px,
        257px 257px;
      animation: cosmos 32s linear infinite alternate;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      opacity: .08;
      mix-blend-mode: screen;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E");
    }

    ::selection {
      background: #fff;
      color: #000;
    }

    .site {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    header {
      min-height: 96px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 24px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      text-align: center;
      animation: fade 1.1s var(--ease) both;
    }

    .identity {
      color: #fff;
      text-decoration: none;
      font-size: clamp(.82rem, 1.4vw, 1rem);
      font-weight: 400;
      letter-spacing: .3em;
      padding-left: .3em;
      white-space: nowrap;
      transition: opacity .35s ease;
    }

    .identity:hover,
    .identity:focus-visible {
      opacity: .58;
      outline: none;
    }

    .section-tag {
      position: absolute;
      right: clamp(22px, 4vw, 60px);
      color: rgba(255,255,255,.32);
      font-size: .68rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      width: 100%;
      display: grid;
      place-items: center;
      padding: clamp(28px, 5vw, 56px) 20px;
    }

    .universe {
      position: relative;
      width: min(680px, 78vw, 72vh);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin: auto;
      animation: fade 1.4s .1s var(--ease) both;
    }

    .universe::before {
      content: "";
      position: absolute;
      inset: 7%;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 50%;
      animation: rotate 46s linear infinite;
    }

    .universe::after {
      content: "";
      position: absolute;
      inset: 24%;
      border: 1px dashed rgba(255,255,255,.055);
      border-radius: 50%;
      animation: rotate-reverse 58s linear infinite;
    }

    .core {
      position: absolute;
      width: clamp(125px, 17vw, 150px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      z-index: 2;
      background:
        radial-gradient(circle, rgba(255,255,255,.09), rgba(255,255,255,.018) 58%, transparent 72%);
      border: 1px solid rgba(255,255,255,.13);
      box-shadow:
        0 0 65px rgba(255,255,255,.04),
        inset 0 0 34px rgba(255,255,255,.025);
      animation: pulse 6s ease-in-out infinite;
    }

    .core::before,
    .core::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.055);
    }

    .core::before {
      inset: -22px;
    }

    .core::after {
      inset: -44px;
    }

    .core span {
      font-size: clamp(.62rem, .9vw, .75rem);
      letter-spacing: .3em;
      padding-left: .3em;
      color: rgba(255,255,255,.48);
      text-transform: uppercase;
    }

    .orbit {
      position: absolute;
      inset: 0;
      animation: orbit-float 10s ease-in-out infinite;
    }

    .link {
      --size: clamp(112px, 14vw, 142px);
      --accent: #fff;

      position: absolute;
      width: var(--size);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      text-align: center;
      text-decoration: none;
      color: rgba(255,255,255,.96);

      background:
        radial-gradient(
          circle at 35% 28%,
          color-mix(in srgb, var(--accent) 30%, transparent),
          transparent 34%
        ),
        rgba(255,255,255,.025);

      border: 1px solid
        color-mix(in srgb, var(--accent) 48%, rgba(255,255,255,.14));

      box-shadow:
        0 0 34px color-mix(in srgb, var(--accent) 13%, transparent),
        inset 0 0 30px rgba(255,255,255,.03);

      backdrop-filter: blur(9px);

      transition:
        transform .55s var(--ease),
        box-shadow .55s ease,
        background .55s ease,
        border-color .55s ease;
    }

    .link::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 1px solid
        color-mix(in srgb, var(--accent) 24%, transparent);
      opacity: .55;
      transition:
        inset .55s var(--ease),
        opacity .55s ease;
    }

    .link::after {
      content: "";
      position: absolute;
      width: 4px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 13px var(--accent);
      top: 13%;
      right: 21%;
      opacity: .85;
    }

    .link span {
      position: relative;
      z-index: 2;
      font-size: clamp(.72rem, 1vw, .88rem);
      font-weight: 400;
      letter-spacing: .14em;
      padding-left: .14em;
      text-transform: uppercase;
    }

    .link:hover,
    .link:focus-visible {
      transform: scale(1.1);
      outline: none;
      background:
        radial-gradient(
          circle at 35% 28%,
          color-mix(in srgb, var(--accent) 44%, transparent),
          transparent 36%
        ),
        rgba(255,255,255,.04);
      border-color:
        color-mix(in srgb, var(--accent) 82%, white 18%);
      box-shadow:
        0 0 60px color-mix(in srgb, var(--accent) 25%, transparent),
        0 0 120px color-mix(in srgb, var(--accent) 9%, transparent),
        inset 0 0 36px rgba(255,255,255,.05);
    }

    .link:hover::before,
    .link:focus-visible::before {
      inset: 6%;
      opacity: .9;
    }

    .instagram {
      --accent: var(--instagram);
      left: 50%;
      top: 1%;
      transform: translateX(-50%);
    }

    .instagram:hover,
    .instagram:focus-visible {
      transform: translateX(-50%) scale(1.1);
    }

    .letterboxd {
      --accent: var(--letterboxd);
      right: 1%;
      top: 30%;
    }

    .twitter {
      --accent: var(--twitter);
      right: 16%;
      bottom: 1%;
    }

    .tiktok {
      --accent: var(--tiktok);
      left: 16%;
      bottom: 1%;
    }

    .youtube {
      --accent: var(--youtube);
      left: 1%;
      top: 30%;
    }

    .orbit-line {
      position: absolute;
      inset: 16%;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: rgba(255,255,255,.11);
      border-right-color: rgba(255,255,255,.03);
      pointer-events: none;
      animation: rotate 20s linear infinite;
    }

    .orbit-line::before {
      content: "";
      position: absolute;
      width: 5px;
      aspect-ratio: 1;
      top: -3px;
      left: 50%;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 16px rgba(255,255,255,.9);
    }

    footer {
      min-height: 82px;
      flex: 0 0 auto;
      border-top: 1px solid rgba(255,255,255,.07);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 18px 24px;
      animation: fade 1.4s .3s var(--ease) both;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,.7);
      text-decoration: none;
      text-transform: uppercase;
      font-size: .74rem;
      letter-spacing: .18em;
      transition: color .35s ease;
    }

    .back-arrow {
      font-size: 1.25rem;
      transition: transform .4s var(--ease);
    }

    .back:hover,
    .back:focus-visible {
      color: #fff;
      outline: none;
    }

    .back:hover .back-arrow,
    .back:focus-visible .back-arrow {
      transform: translateX(-6px);
    }

    .index-mark {
      position: absolute;
      right: clamp(22px, 4vw, 60px);
      color: rgba(255,255,255,.2);
      font-size: .62rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(12px);
        filter: blur(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotate-reverse {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes pulse {
      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }
    }

    @keyframes orbit-float {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes cosmos {
      from {
        transform: translate3d(-1%,-1%,0) scale(1);
      }

      to {
        transform: translate3d(1.5%,1%,0) scale(1.035);
      }
    }

    /* TABLETS */
    @media (max-width: 850px) {
      header {
        min-height: 82px;
      }

      .section-tag,
      .index-mark {
        display: none;
      }

      .universe {
        width: min(620px, 92vw, 68vh);
      }

      .link {
        --size: clamp(100px, 17vw, 128px);
      }

      .link span {
        font-size: clamp(.68rem, 1.5vw, .8rem);
      }
    }

    /* MOBILE — centered, accessible, clean */
    @media (max-width: 600px) {
      body {
        overflow-y: auto;
      }

      .site {
        min-height: 100svh;
      }

      header {
        min-height: 92px;
        padding: 24px 18px;
      }

      .identity {
        font-size: clamp(.8rem, 3.4vw, .95rem);
        line-height: 1.5;
        letter-spacing: .24em;
        padding-left: .24em;
        white-space: normal;
        text-align: center;
      }

      main {
        padding: 34px 18px 42px;
      }

      .universe {
        width: 100%;
        max-width: 430px;
        aspect-ratio: auto;
        display: block;
      }

      .universe::before,
      .universe::after,
      .orbit-line,
      .core {
        display: none;
      }

      .orbit {
        position: static;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: none;
      }

      .link,
      .instagram,
      .letterboxd,
      .twitter,
      .tiktok,
      .youtube {
        position: relative;
        inset: auto;
        left: auto;
        right: auto;
        top: auto;
        bottom: auto;
        transform: none;

        width: min(100%, 390px);
        min-height: 84px;
        aspect-ratio: auto;
        border-radius: 999px;
        padding: 20px 28px;
      }

      .link::before {
        inset: 8px;
        border-radius: 999px;
      }

      .link::after {
        width: 5px;
        top: 18px;
        right: 25px;
      }

      .link span {
        font-size: clamp(.9rem, 4vw, 1.02rem);
        letter-spacing: .13em;
        padding-left: .13em;
      }

      .link:hover,
      .link:focus-visible,
      .instagram:hover,
      .instagram:focus-visible {
        transform: scale(1.025);
      }

      footer {
        min-height: 88px;
        padding: 22px;
      }

      .back {
        font-size: .82rem;
        letter-spacing: .17em;
      }

      .back-arrow {
        font-size: 1.4rem;
      }
    }

    /* SMALL PHONES */
    @media (max-width: 380px) {
      header {
        min-height: 86px;
      }

      .identity {
        font-size: .76rem;
        letter-spacing: .18em;
        padding-left: .18em;
      }

      main {
        padding: 28px 14px 34px;
      }

      .orbit {
        gap: 14px;
      }

      .link,
      .instagram,
      .letterboxd,
      .twitter,
      .tiktok,
      .youtube {
        width: 100%;
        min-height: 78px;
        padding: 18px 20px;
      }

      .link span {
        font-size: .88rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="site">

    <header>
      <a class="identity" href="index.html">JAKUB K. RUCINSKI</a>
      <div class="section-tag">Links / External Signals</div>
    </header>

    <main>
      <section class="universe" aria-label="Social links">

        <div class="orbit-line" aria-hidden="true"></div>

        <div class="core" aria-hidden="true">
          <span>Connect</span>
        </div>

        <div class="orbit">

          <a
            class="link instagram"
            href="https://www.instagram.com/jakubsfantasy/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Jakub K. Rucinski on Instagram"
          >
            <span>Instagram</span>
          </a>

          <a
            class="link letterboxd"
            href="https://letterboxd.com/jakubrucinski/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Jakub K. Rucinski on Letterboxd"
          >
            <span>Letterboxd</span>
          </a>

          <a
            class="link twitter"
            href="https://twitter.com/r_rucinski"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Jakub K. Rucinski on Twitter"
          >
            <span>Twitter</span>
          </a>

          <a
            class="link tiktok"
            href="https://www.tiktok.com/@jakubsfantasy"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Jakub K. Rucinski on TikTok"
          >
            <span>TikTok</span>
          </a>

          <a
            class="link youtube"
            href="https://www.youtube.com/@scorpionmovement"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Scorpion Movement on YouTube"
          >
            <span>YouTube</span>
          </a>

        </div>
      </section>
    </main>

    <footer>
      <a class="back" href="index.html">
        <span class="back-arrow">←</span>
        <span>Back</span>
      </a>

      <div class="index-mark">Signal / 05 Channels</div>
    </footer>

  </div>
</body>
</html>
